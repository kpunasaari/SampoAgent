<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic application form</title></head>
<body>
  <form method="post" action="/fixture/likeit/application">
    <fieldset>
      <legend>Which shifts are you available for?</legend>
      <label><input type="checkbox" name="work_shifts" value="morning">Morning</label>
      <label><input type="checkbox" name="work_shifts" value="evening">Evening</label>
    </fieldset>

    <label for="privacy-consent">
      <input id="privacy-consent" name="privacy_consent" type="checkbox" required>
      I agree to the privacy notice
    </label>
    <button type="submit">Submit application</button>
  </form>
</body>
</html>
