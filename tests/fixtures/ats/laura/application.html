<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Synthetic application form</title></head>
<body>
  <form method="post" enctype="multipart/form-data" action="/apply/warehouse">
    <label for="full-name">Full name</label>
    <input id="full-name" name="full_name" autocomplete="name" required>

    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required>

    <input id="phone" name="phone" type="tel" aria-label="Phone number">

    <label for="source">How did you hear about this role?</label>
    <select id="source" name="source">
      <option value="" selected></option>
      <option value="company">Company website</option>
      <option value="job-board">Job board</option>
    </select>

    <label for="resume">Upload your CV</label>
    <input id="resume" name="resume" type="file" accept=".pdf,application/pdf"
           data-max-file-size="5 MB" required>
    <button type="submit">Apply</button>
  </form>
</body>
</html>
