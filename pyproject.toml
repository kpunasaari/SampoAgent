[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sampoagent"
version = "0.1.0"
description = "Open-source local-first job application and career agent"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pypdf>=4", "python-docx>=1", "reportlab>=4", "python-multipart>=0.0.9", "cryptography>=42", "python-dotenv>=1.0"]

[project.scripts]
sampoagent = "sampoagent.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["sampoagent*"]
